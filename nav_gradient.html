<!DOCTYPE html>
<html>
    <head>
        <title>Hotel Page</title>
        <style>
            body{
                margin: 0;
                font-family: Arial, sans-serif;
            }
           .d1{
            display: flex;  
            justify-content: space-between;
            padding:15px 40px;
            align-items: center;
           }
            .content{
            font-weight: bold;
            letter-spacing: 3px;
            border-top: dotted;
            border-bottom: dotted;
            border-color: orange;
           }
           .nav a{
            text-decoration: none;
            color: black;
           font-weight: bold;
            margin-left: 25px;
           
           }
           /***********hero section******************/
           .main{
            position: relative;
            width: 100%;
           }
           .heroimg{
            width:100%;
            height: 500px;
            background-image: linear-gradient(rgba(199, 115, 46, 0.8),rgba(242, 79, 128, 1)),url(platinapic.png);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
           }
           .herotxt{
           position: absolute;
           top:25%;
           left:35%;
           color: white;
           text-align: center;
            
           }
          .herotxt h1{
            font-size: 40px;
            margin-bottom: 20px;
          }
           .herotxt .btn1{
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
           font-weight: bold;
           }
        </style>  
    </head>

<body>
   <!--Nav bars-->
    <div class="d1" id="Home">
          <div class="content">  PLATINA</div>
          <div class="nav">
            <nav>
                <a href="#Home">Home</a>
                <a href="#facilities">Facilities</a>
                <a href="#service">Service</a>
                 <a href="#book">Book</a>
            </nav>
            </div>
            </div>
            <!--Hero section-->
    <div class="main">
    
        <div class="heroimg"></div>
            <div class="herotxt">
                <h1>Enjoy Holidays<br> with affordable Hotels</h1>
                <button type="submit" class="btn1">START SEARCHING</button>
            
        </div>
        </div>
</body>

</html>
