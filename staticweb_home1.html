           *{
   margin:0;
   padding:0;
   box-sizing:border-box;
}

body{
    background:black;
    color:white;
    font-family:Arial;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:#111;
}

.navbar ul{
    display:flex;
    list-style:none;
    gap:30px;
}

.navbar a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.navbar a:hover{
    color:yellow;
}
.dropdown{
    position:relative;
}

.dropdown-content{
    position:absolute;
    top:100%;
    left:0;
    background:#222;
    min-width:180px;
    display:none;

   /* z-index:100;*/
}

.dropdown-content a{
    display:block;
    padding:12px;
    color:white;
    text-decoration:none;
}

.dropdown-content a:hover{
    background:#444;
}

.dropdown:hover .dropdown-content{
    display:block;
}      

@media screen and (min-width:320px) and (max-width:426px){
     
    .navbar{
         width:100%;
        max-width:1200px;
        flex-direction:column;
        text-align:center;
            }
            }
