<!doctype html>
<html>
<head>
<style>
.one{
    color:red;
}
a[href]{
    color:green;
}
</style>
</head>
<body>
    <div class="one">
        <p class="one">Internal styles are added within a 
             section of the HTML document. This method is useful for styling a single HTML document.
            </p>
            <a href="" class="one">Submit</a>
            <button type="submit" class="one">Reset</button>
    </div>
</body>
</html>
