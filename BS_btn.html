<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

</head>

<body>
<div class="container-fluid">
    Normal Size
        <div class="row">
            <div class="col-md-2"><button class="btn btn-primary">Primary style</button></div>
            <div class="col-md-2 "><button class="btn btn-danger">danger style</button></div>
            <div class="col-md-2  "><button class="btn btn-warning">warning style</button></div>
            <div class="col-md-2  "><button class="btn btn-info">info style</button></div>
            <div class="col-md-2 "><button class="btn btn-success">success style</button></div>
            <div class="col-md-1  "><button class="btn">defult</button></div>
            <div class="col-md-1  "><button class="btn btn-link">link style</button></div>
        </div>
    </div>

    Large Size
    <div class="row">
            <div class="col-md-2"><button class="btn btn-primary btn-lg">Primary style</button></div>
            <div class="col-md-2 "><button class="btn btn-danger btn-lg">danger style</button></div>
            <div class="col-md-2 "><button class="btn btn-warning btn-lg">warning style</button></div>
            <div class="col-md-2 "><button class="btn btn-info btn-lg">info style</button></div>
            <div class="col-md-2 "><button class="btn btn-success btn-lg">success style</button></div>
            <div class="col-md-1 "><button class="btn btn-lg">defult</button></div>
            <div class="col-md-1 "><button class="btn btn-link btn-lg">link style</button></div>
        </div>
    </div>

    small Size
    
    <div class="row">
            <div class="col-md-2"><button class="btn btn-primary btn-sm">Primary style</button></div>
            <div class="col-md-2 "><button class="btn btn-danger btn-sm">danger style</button></div>
            <div class="col-md-2 "><button class="btn btn-warning btn-sm">warning style</button></div>
            <div class="col-md-2 "><button class="btn btn-info btn-sm">info style</button></div>
            <div class="col-md-2 "><button class="btn btn-success btn-sm">success style</button></div>
            <div class="col-md-1 "><button class="btn btn-sm">defult</button></div>
            <div class="col-md-1 "><button class="btn btn-link btn-sm">link style</button></div>
        </div>
    </div>

    Extra small Size
    <div class="row">
            <div class="col-md-2"><button class="btn btn-primary btn-xs">Primary style</button></div>
            <div class="col-md-2 "><button class="btn btn-danger btn-xs">danger style</button></div>
            <div class="col-md-2 "><button class="btn btn-warning btn-xs">warning style</button></div>
            <div class="col-md-2 "><button class="btn btn-info btn-xs">info style</button></div>
            <div class="col-md-2 "><button class="btn btn-success btn-xs">success style</button></div>
            <div class="col-md-1 "><button class="btn btn-xs">defult</button></div>
            <div class="col-md-1 "><button class="btn btn-link btn-xs">link style</button></div>
        </div>
    </div>

    block level
    <div class="row">
            <div class="col-md-2"><button class="btn btn-primary btn-block">Primary style</button></div>
            <div class="col-md-2 "><button class="btn btn-danger btn-block">danger style</button></div>
            <div class="col-md-2 "><button class="btn btn-warning btn-block">warning style</button></div>
            <div class="col-md-2 "><button class="btn btn-info btn-block">info style</button></div>
            <div class="col-md-2 "><button class="btn btn-success btn-block">success style</button></div>
            <div class="col-md-1 "><button class="btn btn-block">defult</button></div>
            <div class="col-md-1 "><button class="btn btn-link btn-block">link style</button></div>
        </div>
    </div>

    </div>
    <button class="btn btn-info btn-block">link style</button>
</body>

</html>
