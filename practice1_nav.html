<!DOCTYPE html>
<html>
    <head>
        <title>Nav bars in bs</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
        <style>
  /* Make the image fully responsive */
  .carousel-inner img {
    width: 100%;
    height: 100%;
  }
  </style>
        
    </head>
    <body>
        
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <button class="navbar-toggler" data-toggle="collapse" data-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="#">Home</a> </li>
            <li class="nav-item"><a class="nav-link" href="#">About</a> </li>
            <li class="nav-item"><a class="nav-link" href="#">Services</a> </li>
        </ul></div>
    </nav>
    <br>
    <!--Dropdown-->
    <div class="dropdown">
        <button class="btn btn-success dropdown-toggle" data-toggle="dropdown">
            Dropdown
        </button>
        <div class="dropdown-menu bg-warning">
            <a href="#" class="dropdown-item">Home</a>
            <a href="#" class="dropdown-item">About</a>
            <a href="#" class="dropdown-item">Services</a>
        </div>
    </div>

    <!--search bar-->
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <form class="form-inline" action="./one.html">
            <input type="text" placeholder="Search" class="form-control mr-2">
            <button class="btn btn-success text-light">Search</button>
        </form>
    </nav>

    <div  id="demo" class="carousel slide" data-ride="carousel" >
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./nature_img.jpg">
            </div>
            <div class="carousel-item">
                <img src="./grad.jpg">
            </div>
            <div class="carousel-item">
                <img src="./cappuccinos.jpg">
            </div>
        </div>

        <!-- Left and right controls -->
  <a class="carousel-control-prev" href="#demo" data-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </a>
  <a class="carousel-control-next" href="#demo" data-slide="next">
    <span class="carousel-control-next-icon"></span>
  </a>
    </div>
    </body>
</html>
