<!DOCTYPE html>
<html>
<head>
<style>

body{
    margin:0;
    overflow:hidden;
    background:skyblue;
}

/* Road */
.road{
    width:100%;
    height:120px;
    background:#333;
    position:absolute;
    bottom:0;
}

/* Road white lines */
.road::before{
    content:"";
    position:absolute;
    width:200%;
    height:6px;
    background:
    repeating-linear-gradient(
        to right,
        white 0px,
        white 40px,
        transparent 40px,
        transparent 80px
    );

    top:55px;

    animation: roadMove 2s linear infinite;
}

/* Bike */
.bike{
    width:120px;
    position:absolute;
    bottom:70px;
    left:-150px;

    animation: bikeMove 6s linear infinite;
}

/* Bike moving */
@keyframes bikeMove{
    0%{
        left:-150px;
    }

    100%{
        left:100%;
    }
}

/* Road moving effect */
@keyframes roadMove{
    0%{
        transform: translateX(0);
    }

    100%{
        transform: translateX(-80px);
    }
}

</style>
</head>

<body>

<!-- Bike Image -->
<img src="bike1.png" class="bike">

<!-- Road -->
<div class="road"></div>

</body>
</html>
