<!DOCTYPE html>
<html>
    <head>
        <style>
            .ss{
                width:500px;
                height: 500px;
                border:2px solid black;

                position: relative;
            }
            .d1{
                width:100px;
                height: 100px;
                border-radius: 50%;
                border: 2px solid black;

                position: absolute;
                top: 50%;
                left:50%;
                transform: translate(-50%,-50%);
            }
            .d2{
                 width:400px;
                height: 400px;
                border-radius: 50%;
                border: 2px solid black;

                position: absolute;
                top: 50%;
                left:50%;
                transform: translate(-50%,-50%);

                animation: er 4s 2s 2 linear;
           
            }
            .d3{
                 width:50px;
                height: 50px;
                border-radius: 50%;
                border: 2px solid black;

                position: absolute;
                top: 50%;
                left:100%;
                transform: translate(-50%,-50%);
           
            }
            .d4{
                 width:80px;
                height: 80px;
                border-radius: 50%;
                border: 2px solid rgb(30, 29, 29);

                position: absolute;
                top: 50%;
                left:50%;
                transform: translate(-50%,-50%);
           
                animation: mr 4s 2s 2 linear;
            }
            .d5{
                 width:25px;
                height: 25px;
                border-radius: 50%;
                border: 2px solid black;

                position: absolute;
                top: 50%;
                left:100%;
                transform: translate(-50%,-50%);
            }

            .mercury-o{
                 width:300px;
                height: 300px;
                border-radius: 50%;
                border: 2px solid black;

                position: absolute;
                top: 50%;
                left:50%;
                transform: translate(-50%,-50%);

                animation: r 4s 2s 2 linear;
           
            }
            .mercury{
                 width:30px;
                height: 30px;
                border-radius: 50%;
                border: 2px solid black;

                position: absolute;
                top: 50%;
                left:100%;
                transform: translate(-50%,-50%);

                animation: r 4s 2s 2 linear;
            }
            @keyframes er{
                0%{
                    /*we need to write translate property again since
                    when animation starts previous transform property replace with rotate only if we wont give translate here again.
                    so,write translate for center positioning+ rotate for rotation*/
                    transform: translate(-50%,-50%) rotate(0deg);
                }
                100%{
                    transform: translate(-50%,-50%) rotate(360deg);
                }
            }
            @keyframes mr{
                0%{
                    transform: translate(-50%,-50%) rotate(0deg);
                }
                100%{
                    transform: translate(-50%,-50%) rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="ss">
            <div class="d1"></div>
            <div class="mercury-o">
                <div class="mercury"></div>
            </div>
            <div class="d2">
                <div class="d3">
                <div class="d4">
                    <div class="d5"></div>
                </div>
                </div>
            </div>
             
            </div>
           
        
    </body>
</html>
